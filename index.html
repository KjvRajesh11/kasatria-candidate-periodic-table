<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kasatria &middot; Candidate Periodic Table</title>
<style>
  :root {
    --bg: #0a0b0e;
    --panel: rgba(14,16,20,0.86);
    --gold: #d4a24c;
    --gold-soft: rgba(212,162,76,0.35);
    --ink: #f4f2ec;
    --ink-dim: rgba(244,242,236,0.6);
    --red: #EF3022;
    --orange: #FDDA35;
    --green: #3A9F48;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }

  button:focus-visible, #continueBtn:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  /* ---------- Sign-in gate ---------- */

  #gate {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(212,162,76,0.10), transparent 55%),
      var(--bg);
    padding: 24px;
  }

  .gate-card {
    width: 100%;
    max-width: 380px;
    text-align: center;
    border: 1px solid rgba(212,162,76,0.25);
    border-radius: 18px;
    padding: 40px 30px 32px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .gate-logo {
    font-family: var(--mono);
    letter-spacing: 0.32em;
    font-size: 12px;
    color: var(--gold);
    margin-bottom: 18px;
    text-transform: uppercase;
  }

  .gate-card h1 {
    font-size: 22px;
    margin: 0 0 10px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .gate-sub {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--ink-dim);
    margin: 0 0 26px;
  }

  #googleBtn {
    display: flex;
    justify-content: center;
    min-height: 40px;
    margin-bottom: 14px;
  }

  #continueBtn {
    display: none;
    width: 100%;
    padding: 11px 18px;
    background: var(--gold);
    color: #1a1206;
    border: 0;
    border-radius: 999px;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    letter-spacing: 0.01em;
  }

  #continueBtn:hover { filter: brightness(1.08); }

  .gate-note {
    margin: 16px 0 0;
    font-size: 11.5px;
    line-height: 1.5;
    color: rgba(244,242,236,0.42);
  }

  /* ---------- App shell ---------- */

  #app { position: fixed; inset: 0; }

  #container {
    position: fixed;
    inset: 0;
    background: var(--bg);
  }

  #hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 18px 22px;
    pointer-events: none;
  }

  .hud-title {
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.01em;
  }

  .hud-title .accent { color: var(--gold); }

  .hud-sub {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-dim);
    margin-top: 3px;
  }

  #legend {
    display: flex;
    gap: 12px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 10.5px;
    font-family: var(--mono);
    color: var(--ink-dim);
    pointer-events: auto;
  }

  #legend span { display: flex; align-items: center; gap: 5px; white-space: nowrap; }

  #legend i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  #menu {
    position: fixed;
    bottom: 22px;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    gap: 8px;
    pointer-events: none;
  }

  #menu button {
    pointer-events: auto;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  #menu button:hover { border-color: var(--gold-soft); color: var(--ink); }

  #menu button.active {
    background: var(--gold);
    color: #1a1206;
    border-color: var(--gold);
  }

  #hint {
    position: fixed;
    bottom: 68px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 10.5px;
    color: rgba(244,242,236,0.32);
    pointer-events: none;
    z-index: 20;
  }

  /* ---------- Candidate tiles ---------- */

  .element {
    width: 150px;
    height: 210px;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    cursor: default;
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }

  .element:hover {
    border-color: rgba(255,255,255,0.55);
    box-shadow: 0 14px 40px rgba(0,0,0,0.6);
  }

  .element .rank {
    position: absolute;
    top: 7px;
    right: 9px;
    font-family: var(--mono);
    font-size: 10px;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    z-index: 2;
  }

  .element .photo-wrap {
    width: 100%;
    height: 98px;
    overflow: hidden;
    background: #05060a;
    position: relative;
  }

  .element .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .element .initials {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.35);
  }

  .element .info {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    top: 98px;
    background: rgba(6,7,10,0.74);
    padding: 9px 10px 10px;
  }

  .element .name {
    font-size: 12px;
    font-weight: 700;
    line-height: 1.28;
    color: #fff;
    max-height: 2.6em;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .element .meta {
    font-family: var(--mono);
    font-size: 10px;
    color: rgba(255,255,255,0.55);
    margin-top: 4px;
  }

  .element .interest {
    display: inline-block;
    margin-top: 7px;
    font-size: 9px;
    padding: 2px 8px;
    border-radius: 20px;
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.82);
  }

  .element .worth {
    position: absolute;
    bottom: 9px;
    left: 10px;
    right: 10px;
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 700;
  }

  @media (max-width: 640px) {
    #hud { flex-direction: column; gap: 10px; padding: 14px; }
    #legend { font-size: 9.5px; padding: 6px 10px; gap: 8px; }
    #menu button { padding: 8px 12px; font-size: 10px; }
    .gate-card { padding: 30px 22px 26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .element { transition: none; }
  }
</style>
</head>
<body>

  <div id="gate">
    <div class="gate-card">
      <div class="gate-logo">KASATRIA</div>
      <h1>Candidate Periodic Table</h1>
      <p class="gate-sub">200 candidates, arranged as an interactive 3D &ldquo;periodic table&rdquo; and colour-coded by net worth.</p>
      <div id="googleBtn"></div>
      <button id="continueBtn" style="display:none;">Continue to preview</button>
      <p id="gateNote" class="gate-note">Checking Google Sign&#8209;In&hellip;</p>
    </div>
  </div>

  <div id="app" style="display:none">
    <div id="container"></div>
    <div id="hud">
        <div>
          <div class="hud-title">Candidate <span class="accent">Periodic Table</span></div>
          <div class="hud-sub" id="dataSource">200 candidates &middot; embedded sample data</div>
        </div>
      
        <div style="display:flex; align-items:center; gap:14px;">
          <div id="legend">
            <span><i style="background:#EF3022"></i>&lt;$100K</span>
            <span><i style="background:#FDDA35"></i>$100K–$200K</span>
            <span><i style="background:#3A9F48"></i>&gt;$200K</span>
          </div>
      
          <div id="userProfile" style="display:none; align-items:center; gap:10px; background:rgba(14,16,20,0.86); border:1px solid rgba(255,255,255,0.08); border-radius:999px; padding:6px 12px 6px 6px; pointer-events:auto;">
            <img id="userPhoto" src="" style="width:28px; height:28px; border-radius:50%; object-fit:cover;">
            <span id="userName" style="font-size:12px; font-weight:600;"></span>
            <button id="logoutBtn" style="background:transparent; border:none; color:rgba(244,242,236,0.6); font-size:11px; cursor:pointer; margin-left:4px;">Logout</button>
          </div>
        </div>
      </div>

      <div id="hint">Drag to rotate · Scroll to zoom</div>
    
    <div id="menu">
      <button id="table">TABLE</button>
      <button id="sphere">SPHERE</button>
      <button id="helix">HELIX</button>
      <button id="grid">GRID</button>
      <button id="pyramid">TETRAHEDRON</button>
      
    </div>

  </div>

<script>
/* =====================================================================
   THREE.CSS3DRenderer / THREE.CSS3DObject
   Verbatim, unmodified, from the official three.js r128 examples
   (examples/js/renderers/CSS3DRenderer.js). Kept as its own block so it
   is easy to see exactly what is third-party vs. assignment-specific
   code below.
   ===================================================================== */
( function () {

	/**
 * Based on http://www.emagix.net/academic/mscs-project/item/camera-sync-with-css3-and-webgl-threejs
 */

	class CSS3DObject extends THREE.Object3D {

		constructor( element ) {

			super();
			this.element = element || document.createElement( 'div' );
			this.element.style.position = 'absolute';
			this.element.style.pointerEvents = 'auto';
			this.addEventListener( 'removed', function () {

				this.traverse( function ( object ) {

					if ( object.element instanceof Element && object.element.parentNode !== null ) {

						object.element.parentNode.removeChild( object.element );

					}

				} );

			} );

		}

		copy( source, recursive ) {

			super.copy( source, recursive );
			this.element = source.element.cloneNode( true );
			return this;

		}

	}

	CSS3DObject.prototype.isCSS3DObject = true;

	class CSS3DSprite extends CSS3DObject {

		constructor( element ) {

			super( element );

		}

	}

	CSS3DSprite.prototype.isCSS3DSprite = true; //

	const _matrix = new THREE.Matrix4();

	class CSS3DRenderer {

		constructor() {

			const _this = this;

			let _width, _height;

			let _widthHalf, _heightHalf;

			const cache = {
				camera: {
					fov: 0,
					style: ''
				},
				objects: new WeakMap()
			};
			const domElement = document.createElement( 'div' );
			domElement.style.overflow = 'hidden';
			this.domElement = domElement;
			const cameraElement = document.createElement( 'div' );
			cameraElement.style.transformStyle = 'preserve-3d';
			cameraElement.style.pointerEvents = 'none';
			domElement.appendChild( cameraElement );

			this.getSize = function () {

				return {
					width: _width,
					height: _height
				};

			};

			this.render = function ( scene, camera ) {

				const fov = camera.projectionMatrix.elements[ 5 ] * _heightHalf;

				if ( cache.camera.fov !== fov ) {

					domElement.style.perspective = camera.isPerspectiveCamera ? fov + 'px' : '';
					cache.camera.fov = fov;

				}

				if ( scene.autoUpdate === true ) scene.updateMatrixWorld();
				if ( camera.parent === null ) camera.updateMatrixWorld();
				let tx, ty;

				if ( camera.isOrthographicCamera ) {

					tx = - ( camera.right + camera.left ) / 2;
					ty = ( camera.top + camera.bottom ) / 2;

				}

				const cameraCSSMatrix = camera.isOrthographicCamera ? 'scale(' + fov + ')' + 'translate(' + epsilon( tx ) + 'px,' + epsilon( ty ) + 'px)' + getCameraCSSMatrix( camera.matrixWorldInverse ) : 'translateZ(' + fov + 'px)' + getCameraCSSMatrix( camera.matrixWorldInverse );
				const style = cameraCSSMatrix + 'translate(' + _widthHalf + 'px,' + _heightHalf + 'px)';

				if ( cache.camera.style !== style ) {

					cameraElement.style.transform = style;
					cache.camera.style = style;

				}

				renderObject( scene, scene, camera, cameraCSSMatrix );

			};

			this.setSize = function ( width, height ) {

				_width = width;
				_height = height;
				_widthHalf = _width / 2;
				_heightHalf = _height / 2;
				domElement.style.width = width + 'px';
				domElement.style.height = height + 'px';
				cameraElement.style.width = width + 'px';
				cameraElement.style.height = height + 'px';

			};

			function epsilon( value ) {

				return Math.abs( value ) < 1e-10 ? 0 : value;

			}

			function getCameraCSSMatrix( matrix ) {

				const elements = matrix.elements;
				return 'matrix3d(' + epsilon( elements[ 0 ] ) + ',' + epsilon( - elements[ 1 ] ) + ',' + epsilon( elements[ 2 ] ) + ',' + epsilon( elements[ 3 ] ) + ',' + epsilon( elements[ 4 ] ) + ',' + epsilon( - elements[ 5 ] ) + ',' + epsilon( elements[ 6 ] ) + ',' + epsilon( elements[ 7 ] ) + ',' + epsilon( elements[ 8 ] ) + ',' + epsilon( - elements[ 9 ] ) + ',' + epsilon( elements[ 10 ] ) + ',' + epsilon( elements[ 11 ] ) + ',' + epsilon( elements[ 12 ] ) + ',' + epsilon( - elements[ 13 ] ) + ',' + epsilon( elements[ 14 ] ) + ',' + epsilon( elements[ 15 ] ) + ')';

			}

			function getObjectCSSMatrix( matrix ) {

				const elements = matrix.elements;
				const matrix3d = 'matrix3d(' + epsilon( elements[ 0 ] ) + ',' + epsilon( elements[ 1 ] ) + ',' + epsilon( elements[ 2 ] ) + ',' + epsilon( elements[ 3 ] ) + ',' + epsilon( - elements[ 4 ] ) + ',' + epsilon( - elements[ 5 ] ) + ',' + epsilon( - elements[ 6 ] ) + ',' + epsilon( - elements[ 7 ] ) + ',' + epsilon( elements[ 8 ] ) + ',' + epsilon( elements[ 9 ] ) + ',' + epsilon( elements[ 10 ] ) + ',' + epsilon( elements[ 11 ] ) + ',' + epsilon( elements[ 12 ] ) + ',' + epsilon( elements[ 13 ] ) + ',' + epsilon( elements[ 14 ] ) + ',' + epsilon( elements[ 15 ] ) + ')';
				return 'translate(-50%,-50%)' + matrix3d;

			}

			function renderObject( object, scene, camera, cameraCSSMatrix ) {

				if ( object.isCSS3DObject ) {

					object.onBeforeRender( _this, scene, camera );
					let style;

					if ( object.isCSS3DSprite ) {

						// http://swiftcoder.wordpress.com/2008/11/25/constructing-a-billboard-matrix/
						_matrix.copy( camera.matrixWorldInverse );

						_matrix.transpose();

						_matrix.copyPosition( object.matrixWorld );

						_matrix.scale( object.scale );

						_matrix.elements[ 3 ] = 0;
						_matrix.elements[ 7 ] = 0;
						_matrix.elements[ 11 ] = 0;
						_matrix.elements[ 15 ] = 1;
						style = getObjectCSSMatrix( _matrix );

					} else {

						style = getObjectCSSMatrix( object.matrixWorld );

					}

					const element = object.element;
					const cachedObject = cache.objects.get( object );

					if ( cachedObject === undefined || cachedObject.style !== style ) {

						element.style.transform = style;
						const objectData = {
							style: style
						};
						cache.objects.set( object, objectData );

					}

					element.style.display = object.visible ? '' : 'none';

					if ( element.parentNode !== cameraElement ) {

						cameraElement.appendChild( element );

					}

					object.onAfterRender( _this, scene, camera );

				}

				for ( let i = 0, l = object.children.length; i < l; i ++ ) {

					renderObject( object.children[ i ], scene, camera, cameraCSSMatrix );

				}

			}

		}

	}

	THREE.CSS3DObject = CSS3DObject;
	THREE.CSS3DRenderer = CSS3DRenderer;
	THREE.CSS3DSprite = CSS3DSprite;

} )();

</script>

function setDataSourceLabel(text) {
  const el = document.getElementById('dataSource');
  if (el) el.textContent = ACTIVE_CANDIDATES.length + ' candidates \u00b7 ' + text;
}

// Pulls live rows from a published/shared Google Sheet via the gviz
// endpoint (no API key needed for a sheet shared as "Anyone with the
// link can view"). Falls back to the embedded dataset on any error —
// missing config, network/CORS issues, or an empty sheet.
async function loadCandidateData() {
  if (!isSheetConfigured()) {
    setDataSourceLabel('embedded sample data (no Sheet ID set)');
    return EMBEDDED_CANDIDATES;
  }
  try {
    const url = 'https://docs.google.com/spreadsheets/d/' + CONFIG.GOOGLE_SHEET_ID +
      '/gviz/tq?tqx=out:json&sheet=' + encodeURIComponent(CONFIG.GOOGLE_SHEET_NAME);
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
    const parsed = JSON.parse(jsonText);
    const cols = parsed.table.cols.map(c => (c.label || '').toString().trim().toLowerCase());
    const idx = {
      name: cols.indexOf('name'),
      photo: cols.indexOf('photo'),
      age: cols.indexOf('age'),
      country: cols.indexOf('country'),
      interest: cols.indexOf('interest'),
      worth: cols.findIndex(c => c.indexOf('net worth') !== -1)
    };
    const rows = parsed.table.rows.map(r => {
      const cell = i => (i >= 0 && r.c[i]) ? r.c[i] : null;
      const worthCell = cell(idx.worth);
      let worthNum = 0;
      if (worthCell) {
        worthNum = typeof worthCell.v === 'number'
          ? worthCell.v
          : parseFloat(String(worthCell.v ?? worthCell.f ?? '0').replace(/[^0-9.\-]/g, '')) || 0;
      }
      return {
        n: cell(idx.name) ? String(cell(idx.name).v) : '',
        p: cell(idx.photo) ? String(cell(idx.photo).v) : '',
        a: cell(idx.age) ? Number(cell(idx.age).v) : 0,
        c: cell(idx.country) ? String(cell(idx.country).v) : '',
        i: cell(idx.interest) ? String(cell(idx.interest).v) : '',
        w: worthNum
      };
    }).filter(r => r.n);

    if (!rows.length) throw new Error('Sheet returned 0 usable rows');
    setDataSourceLabel('live \u00b7 Google Sheet');
    return rows;
  } catch (err) {
    console.warn('[candidate-table] Sheet fetch failed, using embedded data:', err.message);
    setDataSourceLabel('embedded sample data (Sheet fetch unavailable)');
    return EMBEDDED_CANDIDATES;
  }
}

// 3. Net worth colour bands — thresholds per the assignment, hex values
//    taken directly from the reference "Data Structure" slide (Image B).
// ---------------------------------------------------------------------
function bandFor(worth) {
  if (worth < 100000) return { color: '#EF3022', label: 'Under $100K' };
  if (worth < 200000) return { color: '#FDDA35', label: '$100K\u2013$200K' };
  return { color: '#3A9F48', label: 'Over $200K' };
}
function formatMoney(w) {
  return '$' + Number(w).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function createCandidateElement(c, index) {
  const band = bandFor(c.w);

  const el = document.createElement('div');
  el.className = 'element';
  el.style.background = band.color;

  const rank = document.createElement('div');
  rank.className = 'rank';
  rank.textContent = '#' + (index + 1);
  el.appendChild(rank);

  const photoWrap = document.createElement('div');
  photoWrap.className = 'photo-wrap';
  const img = document.createElement('img');
  img.src = c.p;
  img.alt = c.n;
  img.loading = 'lazy';
  img.referrerPolicy = 'no-referrer';
  img.onerror = function () {
    photoWrap.innerHTML = '';
    const initials = document.createElement('div');
    initials.className = 'initials';
    initials.textContent = (c.n || '?').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
    photoWrap.appendChild(initials);
  };
  photoWrap.appendChild(img);
  el.appendChild(photoWrap);

  const info = document.createElement('div');
  info.className = 'info';

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = c.n;
  info.appendChild(name);

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = c.a + 'y \u00b7 ' + c.c;
  info.appendChild(meta);

  const interest = document.createElement('div');
  interest.className = 'interest';
  interest.textContent = c.i;
  info.appendChild(interest);

  const worth = document.createElement('div');
  worth.className = 'worth';
  worth.textContent = formatMoney(c.w);
  worth.style.color = band.color;
  info.appendChild(worth);

  el.appendChild(info);
  el.title = c.n + ' \u2014 ' + band.label;

  return el;
}

// ---------------------------------------------------------------------
// 4. Minimal tween engine (no external animation library — avoids a
//    version-compatibility dependency for a ~15-line job). Same
//    exponential in/out easing as the reference demo.
// ---------------------------------------------------------------------
const activeTweens = [];
function easeExponentialInOut(t) {
  if (t === 0) return 0;
  if (t === 1) return 1;
  if ((t *= 2) < 1) return 0.5 * Math.pow(2, 10 * (t - 1));
  return 0.5 * (-Math.pow(2, -10 * (t - 1)) + 2);
}
function tweenTo(target, toValues, duration) {
  const from = {};
  for (const k in toValues) from[k] = target[k];
  activeTweens.push({ target, from, to: toValues, duration, startTime: null });
}
function updateTweens(now) {
  for (let i = activeTweens.length - 1; i >= 0; i--) {
    const tw = activeTweens[i];
    if (tw.startTime === null) tw.startTime = now;
    const t = Math.min(1, (now - tw.startTime) / tw.duration);
    const e = easeExponentialInOut(t);
    for (const k in tw.to) {
      tw.target[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
    }
    if (t >= 1) activeTweens.splice(i, 1);
  }
}

// ---------------------------------------------------------------------
// 5. Layout targets — table (20x10), sphere, double helix, grid (10x4x5)
// ---------------------------------------------------------------------
function buildTargets(candidates) {
  const n = candidates.length;
  const targets = { table: [], sphere: [], helix: [], grid: [], pyramid: [] };
  const vector = new THREE.Vector3();

  // TABLE — 20 columns × 10 rows
  const TCOLS = 20, TROWS = 10;
  const tSpX = 170, tSpY = 230;
  const tOffX = (TCOLS - 1) * tSpX / 2;
  const tOffY = (TROWS - 1) * tSpY / 2;
  for (let i = 0; i < n; i++) {
    const col = i % TCOLS, row = Math.floor(i / TCOLS);
    const obj = new THREE.Object3D();
    obj.position.set(col * tSpX - tOffX, -(row * tSpY) + tOffY, 0);
    targets.table.push(obj);
  }

  // SPHERE
  const sphereRadius = 1100;
  for (let i = 0; i < n; i++) {
    const phi = Math.acos(-1 + (2 * i) / n);
    const theta = Math.sqrt(n * Math.PI) * phi;
    const obj = new THREE.Object3D();
    obj.position.setFromSphericalCoords(sphereRadius, phi, theta);
    vector.copy(obj.position).multiplyScalar(2);
    obj.lookAt(vector);
    targets.sphere.push(obj);
  }

  // ========== ADVANCED DOUBLE HELIX ==========
  // Two strands with larger separation for better visibility
// ========== ADVANCED DOUBLE HELIX ==========
const HELIX_RADIUS = 650;
const HELIX_HEIGHT_STEP = 50;
const HELIX_ANGLE_STEP = 0.35;

for (let i = 0; i < n; i++) {
  const item = new THREE.Object3D();

  const strand = i % 2;
  const indexOnStrand = Math.floor(i / 2);

  const angle = indexOnStrand * HELIX_ANGLE_STEP + (strand * Math.PI);
  const y = (indexOnStrand - n / 4) * HELIX_HEIGHT_STEP;

  item.position.x = HELIX_RADIUS * Math.cos(angle);
  item.position.y = y;
  item.position.z = HELIX_RADIUS * Math.sin(angle);

  const lookTarget = new THREE.Vector3(
    HELIX_RADIUS * Math.cos(angle + 0.1),
    y,
    HELIX_RADIUS * Math.sin(angle + 0.1)
  );
  item.lookAt(lookTarget);
  targets.helix.push(item);
}

  // ========== GRID 5 × 4 × 10 ==========
  // Matches company Image C: 5 (width) × 4 (height) × 10 (depth)
  const GX = 5;   // width
  const GY = 4;   // height
  const GZ = 10;  // depth

  const gSpX = 200;
  const gSpY = 240;
  const gSpZ = 320;

  const gOffX = (GX - 1) * gSpX / 2;
  const gOffY = (GY - 1) * gSpY / 2;
  const gOffZ = (GZ - 1) * gSpZ / 2;

  for (let i = 0; i < n; i++) {
    const col   = i % GX;
    const row   = Math.floor(i / GX) % GY;
    const layer = Math.floor(i / (GX * GY));

    const obj = new THREE.Object3D();
    obj.position.set(
      col * gSpX - gOffX,
      -(row * gSpY) + gOffY,
      layer * gSpZ - gOffZ
    );
    targets.grid.push(obj);
  }

// ========== TETRAHEDRON (4-FACE PYRAMID) ==========
const r = 1200;
  const v0 = new THREE.Vector3(0, r, 0);
  const v1 = new THREE.Vector3(r * Math.sqrt(8/9), -r/3, 0);
  const v2 = new THREE.Vector3(-r * Math.sqrt(2/9), -r/3, r * Math.sqrt(2/3));
  const v3 = new THREE.Vector3(-r * Math.sqrt(2/9), -r/3, -r * Math.sqrt(2/3));

  const faces = [
    [v0, v1, v2],
    [v0, v2, v3],
    [v0, v3, v1],
    [v1, v3, v2]
  ];

  for (let i = 0; i < n; i++) {
    const faceIdx = i % 4;
    const itemInFace = Math.floor(i / 4);
    const face = faces[faceIdx];

    const u = ((itemInFace % 5) + 1) / 6;
    const v = (Math.floor(itemInFace / 5) + 1) / 6;
    const w = 1 - u - v;

    const pos = new THREE.Vector3()
      .addScaledVector(face[0], Math.abs(u))
      .addScaledVector(face[1], Math.abs(v))
      .addScaledVector(face[2], Math.abs(w));

    const obj = new THREE.Object3D();
    obj.position.copy(pos);

    const cb = new THREE.Vector3().subVectors(face[2], face[1]);
    const ab = new THREE.Vector3().subVectors(face[0], face[1]);
    cb.cross(ab).normalize();

    const targetPos = new THREE.Vector3().addVectors(pos, cb);
    obj.lookAt(targetPos);

    targets.pyramid.push(obj);
  }

  return targets;
}

// ---------------------------------------------------------------------
// 6. Scene / render loop / simple orbit controls
// ---------------------------------------------------------------------
let camera, scene, renderer;
const objects = [];
let targets = null;

let azimuth = 0, polar = Math.PI / 2, camDistance = 3400;
const MIN_DIST = 900, MAX_DIST = 9000;
let dragging = false, lastX = 0, lastY = 0;

function computeFitDistance(halfWidth, halfHeight) {
  const aspect = window.innerWidth / window.innerHeight;
  const vFOV = camera.fov * Math.PI / 180;
  const distForHeight = halfHeight / Math.tan(vFOV / 2);
  const distForWidth = halfWidth / (Math.tan(vFOV / 2) * aspect);
  return Math.max(distForHeight, distForWidth, 1200) * 1.15;
}

function initControls() {
  const dom = renderer.domElement;
  dom.style.touchAction = 'none';
  dom.addEventListener('pointerdown', e => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    try { dom.setPointerCapture(e.pointerId); } catch (err) {}
  });
  dom.addEventListener('pointerup', () => { dragging = false; });
  dom.addEventListener('pointercancel', () => { dragging = false; });
  dom.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    azimuth -= dx * 0.005;
    polar -= dy * 0.005;
    polar = Math.max(0.12, Math.min(Math.PI - 0.12, polar));
  });
  dom.addEventListener('wheel', e => {
    e.preventDefault();
    camDistance += e.deltaY * 0.85;
    camDistance = Math.max(MIN_DIST, Math.min(MAX_DIST, camDistance));
  }, { passive: false });
}

function updateCameraFromControls() {
  camera.position.x = camDistance * Math.sin(polar) * Math.sin(azimuth);
  camera.position.z = camDistance * Math.sin(polar) * Math.cos(azimuth);
  camera.position.y = camDistance * Math.cos(polar);
  camera.lookAt(0, 0, 0);
}

function transform(newTargets, duration) {
  activeTweens.length = 0;
  const d = REDUCE_MOTION ? Math.min(duration, 600) : duration;
  for (let i = 0; i < objects.length; i++) {
    const object = objects[i];
    const target = newTargets[i];
    const jitter = REDUCE_MOTION ? 0 : Math.random() * d;
    tweenTo(object.position, { x: target.position.x, y: target.position.y, z: target.position.z }, jitter + d);
    tweenTo(object.rotation, { x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, jitter + d);
  }
}

function setActiveButton(key) {
  ['table', 'sphere', 'helix', 'grid'].forEach(k => {
    document.getElementById(k).classList.toggle('active', k === key);
  });
}

function initMenu() {
  document.getElementById('table').addEventListener('click', () => { setActiveButton('table'); transform(targets.table, 2000); });
  document.getElementById('sphere').addEventListener('click', () => { setActiveButton('sphere'); transform(targets.sphere, 2000); });
  document.getElementById('helix').addEventListener('click', () => { setActiveButton('helix'); transform(targets.helix, 2000); });
  document.getElementById('grid').addEventListener('click', () => { setActiveButton('grid'); transform(targets.grid, 2000); });
  setActiveButton('table');
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate(now) {
  requestAnimationFrame(animate);
  updateTweens(now || performance.now());
  updateCameraFromControls();
  renderer.render(scene, camera);
}

function initScene() {
  camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 20000);
  scene = new THREE.Scene();

  ACTIVE_CANDIDATES.forEach((c, i) => {
    const el = createCandidateElement(c, i);
    const objectCSS = new THREE.CSS3DObject(el);
    objectCSS.position.x = Math.random() * 4000 - 2000;
    objectCSS.position.y = Math.random() * 4000 - 2000;
    objectCSS.position.z = Math.random() * 4000 - 2000;
    scene.add(objectCSS);
    objects.push(objectCSS);
  });

  targets = buildTargets(ACTIVE_CANDIDATES);

  renderer = new THREE.CSS3DRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('container').appendChild(renderer.domElement);

  camDistance = computeFitDistance(1615 + 75, 1035 + 105); // table half-extent + tile half-size

  initControls();
  initMenu();
  transform(targets.table, 2000);

  window.addEventListener('resize', onWindowResize);

  animate();
}

// ---------------------------------------------------------------------
// 7. Google Sign-In gate, with a graceful fallback. The Google Identity
//    Services script is loaded from accounts.google.com (not cdnjs), so
//    it will not load inside this chat's sandboxed preview — that's
//    expected here and is why the "Continue to preview" fallback exists.
//    Once this file is deployed to a real domain with CONFIG.GOOGLE_CLIENT_ID
//    set, the real Google login will render and gate access for real.
// ---------------------------------------------------------------------
function boot() {
  const continueBtn = document.getElementById('continueBtn');
  const gateNote = document.getElementById('gateNote');
  let settled = false;

  function proceed(user = null) {
  if (settled) return;
  settled = true;

  // Show user profile if available
  if (user) {
    const profile = document.getElementById('userProfile');
    const photo = document.getElementById('userPhoto');
    const name = document.getElementById('userName');

    if (user.picture) photo.src = user.picture;
    name.textContent = user.name || user.email || 'User';
    profile.style.display = 'flex';

    // Logout button
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.onclick = function () {
        if (window.google && google.accounts && google.accounts.id) {
          google.accounts.id.disableAutoSelect();
        }
        location.reload();
      };
    }
  }

  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  startApp();
}

  function showFallback(message) {
    gateNote.textContent = message;
    continueBtn.style.display = 'inline-block';
  }
  setTimeout(() => {
  showFallback('Click below to continue to the 3D application.');
  continueBtn.addEventListener('click', () => proceed());
}, 1500);

  if (!isClientIdConfigured()) {
    showFallback('Google Sign-In isn’t configured yet.');
    continueBtn.addEventListener('click', () => proceed());
    return;
  }

  const script = document.createElement('script');
  script.src = 'https://accounts.google.com/gsi/client';
  script.async = true;
  script.onload = () => {
    try {
      google.accounts.id.initialize({
        client_id: CONFIG.GOOGLE_CLIENT_ID,
        callback: (response) => {
          // Decode the credential to get user info
          const base64Url = response.credential.split('.')[1];
          const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
          const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
          }).join(''));
          const user = JSON.parse(jsonPayload);
          proceed(user);
        }
      });

      google.accounts.id.renderButton(document.getElementById('googleBtn'), {
        theme: 'filled_black',
        size: 'large',
        shape: 'pill'
      });

      gateNote.textContent = 'Sign in with Google to continue.';
    } catch (e) {
      showFallback('Google Sign-In failed to initialize.');
      continueBtn.addEventListener('click', () => proceed());
    }
  };
  script.onerror = () => {
    showFallback('Unable to reach Google. Please check your connection and refresh.');
    continueBtn.addEventListener('click', () => proceed());
  };
  document.head.appendChild(script);
  
}

async function startApp() {
  ACTIVE_CANDIDATES = await loadCandidateData();
  initScene();
}

boot();
</script>
